[project]
name = "sovereign-ml-gitops"
version = "1.4.0"
description = "Per-authority fine-tuned models released through GitLab CI, Argo CD and Helm on on-prem Kubernetes"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pyjwt[crypto]>=2.8",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = ["torch>=2.2", "lupa>=2.0"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "cryptography>=42"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = ["e2e: needs the services from deploy/compose/e2e.yaml running"]
addopts = "-m 'not e2e'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/report.py" = ["E501"]          # README table rows read better on one line each
"src/sov/world/pii.py" = ["E501"]
"tests/e2e/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sov"]
known-local-folder = ["_common", "_ml"]
