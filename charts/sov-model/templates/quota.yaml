apiVersion: v1
kind: ResourceQuota
metadata:
  name: sov-quota
  labels:
    {{- include "sov.labels" . | nindent 4 }}
spec:
  hard:
    pods: {{ .Values.quota.pods | quote }}
    requests.cpu: {{ .Values.quota.cpu | quote }}
    limits.memory: {{ .Values.quota.memory | quote }}
---
apiVersion: v1
kind: LimitRange
metadata:
  name: sov-limits
  labels:
    {{- include "sov.labels" . | nindent 4 }}
spec:
  limits:
    - type: Container
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
