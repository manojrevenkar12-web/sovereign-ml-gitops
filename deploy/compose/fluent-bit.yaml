# Same filters as deploy/observability/fluent-bit-values.yaml, with an HTTP input instead of container logs.
service:
  flush: 1
  log_level: info
pipeline:
  inputs:
    - name: http
      listen: 0.0.0.0
      port: 9880
      tag: e2e
  filters:
    - name: lua
      match: "*"
      script: /fluent-bit/scripts/redact.lua
      call: redact_record
    - name: lua
      match: "*"
      script: /fluent-bit/scripts/tenant.lua
      call: set_tenant
  outputs:
    - name: loki
      match: "*"
      host: loki
      port: 3100
      tenant_id_key: sov_tenant
      remove_keys: sov_tenant
      labels: job=e2e
      line_format: json
