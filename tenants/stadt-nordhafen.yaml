# One file per authority. Onboarding an authority is one merge request adding a file like this one;
# scripts/scaffold.py turns it into namespaces, network policies, Vault policies, a Keycloak realm, a
# Loki tenant, a Grafana data source and an Argo CD application. Only the release step changes model.adapter.
name: stadt-nordhafen
display_name: Stadt Nordhafen
kind: kreisfreie Stadt
contact: it-betrieb@stadt-nordhafen.example
model:
  base: sha256:2da3aa2f309df88a5c0f534b818baa1440a926bd48fec67578da46b8a208913b
  adapter: sha256:7b5d4967916501d8c5a026167cef64878d058287925044358a27b7fb781a8522
  critical: [ordnungsamt]       # departments whose recall the release gate holds to a floor
serving:
  replicas: 2
  cpu: 250m
  memory: 384Mi
fine_tune:
  where: ionos                     # ionos: GPU pool on IONOS Cloud, allowed only for pseudonymised data
logs:
  retention_days: 30
access:
  groups:
    - name: buergerservice
      roles: [inquiry-router]
    - name: fachaufsicht
      roles: [inquiry-router, audit-reader]
