# fluent/fluent-bit chart. Every container log line passes redact.lua (generated from config/pii_rules.yaml)
# before it leaves the node, then goes to Loki under its authority's tenant id.
luaScripts: {}
extraVolumes:
  - name: sov-scripts
    configMap:
      name: fluent-bit-scripts
  - name: sov-outputs
    configMap:
      name: fluent-bit-outputs          # deploy/generated/fluent-bit: one Loki output per authority
extraVolumeMounts:
  - name: sov-scripts
    mountPath: /fluent-bit/scripts/sov
    readOnly: true
  - name: sov-outputs
    mountPath: /fluent-bit/etc/sov
    readOnly: true
env:
  - name: LOKI_HOST
    value: loki-gateway.observability.svc
  - name: LOKI_PORT
    value: "80"
config:
  inputs: |
    [INPUT]
        Name              tail
        Path              /var/log/containers/*.log
        multiline.parser  cri, docker
        Tag               kube.*
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
  filters: |
    [FILTER]
        Name                kubernetes
        Match               kube.*
        Merge_Log           On
        Keep_Log            Off
        Labels              Off
        Annotations         Off
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/sov/redact.lua
        call    redact_record
    [FILTER]
        Name    lua
        Match   kube.*
        script  /fluent-bit/scripts/sov/tenant.lua
        call    set_tenant
    # Re-tag by authority; each authority has its own Loki output with a fixed tenant id.
    [FILTER]
        Name          rewrite_tag
        Match         kube.*
        Rule          $sov_tenant ^(.+)$ sov.$1 false
        Emitter_Name  sov_by_tenant
  outputs: |
    @INCLUDE /fluent-bit/etc/sov/outputs.conf
