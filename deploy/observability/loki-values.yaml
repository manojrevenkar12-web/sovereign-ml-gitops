# grafana/loki chart, single binary on premises. auth_enabled: every request names its tenant
# (X-Scope-OrgID), so an authority's logs are stored and queried apart from every other's.
deploymentMode: SingleBinary
loki:
  auth_enabled: true
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: {prefix: index_, period: 24h}
  limits_config:
    retention_period: 720h
    allow_structured_metadata: true
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  runtimeConfig: {}          # per-authority retention: deploy/generated/loki/overrides.yaml
singleBinary:
  replicas: 1
  persistence: {size: 50Gi}
backend: {replicas: 0}
read: {replicas: 0}
write: {replicas: 0}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
