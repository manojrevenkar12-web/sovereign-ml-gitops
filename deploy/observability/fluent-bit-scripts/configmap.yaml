  redact.lua: "-- GENERATED by scripts/gen_redactor.py from config/pii_rules.yaml and src/sov/pii/engine.lua.\n-- Do not edit by hand.\n\nPLACEHOLDER = \"<{kind}>\"\n\nRULES = {\n  {kind = \"email\", patterns = {\"[%w%._%+%-]+@[%w%-]+%.[%w%.%-]*%a\", \"[%w%._%+%-]+%%40[%w%-]+%.[%w%.%-]*%a\"}},\n  {kind = \"iban\", patterns = {\"%f[%w]DE%d%d\"}, validator = \"iban\"},\n  {kind = \"steuerid\", patterns = {\"%f[%d]%d%d%d%d%d%d%d%d%d%d%d%f[%D]\"}, validator = \"steuerid\"},\n  {kind = \"dob\", patterns = {\"%f[%d]%d%d%.%d%d%.%d%d%d%d%f[%D]\"}, context = {\"geb.\", \"geboren\", \"geburtsdatum\", \"dob=\", \"birth\"}, context_window = 24},\n  {kind = \"ip\", patterns = {\"%f[%d]%d%d?%d?%.%d%d?%d?%.%d%d?%d?%.%d%d?%d?%f[%D]\"}, validator = \"ipv4\"},\n  {kind = \"phone\", patterns = {\"%+49[ %d/%-]*%d\", \"%%2B49[%d%%]*%d\", \"%f[%d]0%d%d+[ /%-]%d[%d %-]*%d\", \"%f[%d]0%d%d+%%20%d+\"}, validator = \"phone\"},\n  {kind = \"name\", after = {\"mein name ist \", \"name: \", \"'name': '\", \"name=\"\
    , \"herr \", \"frau \", \"antragsteller: \", \"antragstellerin: \", \"viele grüße \", \"inhaber: \"}, tokens = 2},\n  {kind = \"name\", gazetteer = {\"alexander\", \"ali\", \"andrea\", \"andreas\", \"angelika\", \"anja\", \"anna\", \"antonia\", \"ayse\", \"barbara\", \"ben\", \"benjamin\", \"birgit\", \"carina\", \"carla\", \"christian\", \"christina\", \"claudia\", \"daniel\", \"david\", \"denise\", \"dennis\", \"dieter\", \"elias\", \"elif\", \"elisabeth\", \"ella\", \"emil\", \"emilia\", \"emily\", \"emine\", \"emma\", \"erika\", \"eva\", \"fabian\", \"fatma\", \"felix\", \"finn\", \"florian\", \"frank\", \"franziska\", \"gabriele\", \"hannah\", \"hans\", \"heike\", \"helga\", \"hüseyin\", \"ibrahim\", \"ida\", \"ingrid\", \"jakob\", \"jana\", \"jannik\", \"jasmin\", \"jessica\", \"johanna\", \"jonas\", \"julia\", \"julian\", \"jürgen\", \"karin\", \"katharina\", \"kerstin\", \"klaus\", \"lara\", \"laura\", \"lea\", \"lena\", \"leon\", \"leonie\", \"lina\", \"lisa\", \"louis\", \"\
    luca\", \"luisa\", \"lukas\", \"manfred\", \"marcel\", \"maria\", \"marie\", \"markus\", \"martin\", \"martina\", \"matthias\", \"maximilian\", \"mehmet\", \"melanie\", \"mia\", \"michael\", \"mila\", \"monika\", \"moritz\", \"murat\", \"mustafa\", \"nadine\", \"niklas\", \"nina\", \"noah\", \"olga\", \"oliver\", \"patrick\", \"paul\", \"peter\", \"petra\", \"philipp\", \"renate\", \"sabine\", \"sandra\", \"sarah\", \"sebastian\", \"simon\", \"sofia\", \"sophie\", \"stefan\", \"stefanie\", \"susanne\", \"sven\", \"thomas\", \"tim\", \"tobias\", \"ursula\", \"uwe\", \"valentina\", \"werner\", \"wolfgang\", \"yusuf\"}, surname = true},\n  {kind = \"address\", suffixes = {\"straße\", \"strasse\", \"str.\", \"weg\", \"allee\", \"platz\", \"ring\", \"gasse\"}, prefixes = {\"am \", \"an der \", \"im \", \"auf dem \"}}\n}\n\n-- Redaction engine. Lua 5.1 / LuaJIT, so the same file runs inside Fluent Bit and, through lupa, in\n-- the ML pipeline. RULES is prepended by scripts/gen_redactor.py\
    \ from config/pii_rules.yaml.\n\nlocal M = {}\n\nlocal function digits_only(s)\n  return (s:gsub(\"%D\", \"\"))\nend\n\nlocal function mod97(numstr)\n  local r = 0\n  for i = 1, #numstr do\n    r = (r * 10 + tonumber(numstr:sub(i, i))) % 97\n  end\n  return r\nend\n\n-- IBAN (DE): \"DE\" + 2 check digits + 18 digits, single spaces allowed between digits.\nlocal function iban_end(text, s)\n  local i, count, last = s + 4, 0, s + 3\n  while i <= #text and count < 18 do\n    local c = text:sub(i, i)\n    if c:match(\"%d\") then\n      count, last, i = count + 1, i, i + 1\n    elseif c == \" \" and text:sub(i + 1, i + 1):match(\"%d\") then\n      i = i + 1\n    else\n      break\n    end\n  end\n  if count ~= 18 or text:sub(last + 1, last + 1):match(\"%d\") then\n    return nil\n  end\n  local raw = digits_only(text:sub(s + 2, last))\n  if mod97(raw:sub(3) .. \"1314\" .. raw:sub(1, 2)) ~= 1 then\n    return nil\n  end\n  return last\nend\n\nlocal validators = {}\n\nfunction validators.steuerid(m)\n\
    \  if m:sub(1, 1) == \"0\" then return false end\n  local counts, multi = {}, 0\n  for i = 1, 10 do\n    local d = m:sub(i, i)\n    counts[d] = (counts[d] or 0) + 1\n  end\n  for _, c in pairs(counts) do\n    if c > 3 then return false end\n    if c >= 2 then multi = multi + 1 end\n  end\n  if multi ~= 1 then return false end\n  local product = 10\n  for i = 1, 10 do\n    local s = (tonumber(m:sub(i, i)) + product) % 10\n    if s == 0 then s = 10 end\n    product = (s * 2) % 11\n  end\n  local check = 11 - product\n  if check == 10 then check = 0 end\n  return check == tonumber(m:sub(11, 11))\nend\n\nfunction validators.ipv4(m)\n  for octet in m:gmatch(\"%d+\") do\n    if tonumber(octet) > 255 then return false end\n  end\n  return true\nend\n\nfunction validators.phone(m)\n  local n = #digits_only(m:gsub(\"%%2[0B]\", \" \"))\n  return n >= 9 and n <= 15\nend\n\nlocal function overlaps(spans, s, e)\n  for _, sp in ipairs(spans) do\n    if s <= sp[3] and e >= sp[2] then return true end\n\
    \  end\n  return false\nend\n\nlocal function has_context(lower, s, words, window)\n  local from = s - window\n  if from < 1 then from = 1 end\n  local before = lower:sub(from, s - 1)\n  for _, w in ipairs(words) do\n    if before:find(w, 1, true) then return true end\n  end\n  return false\nend\n\nlocal function escape(p)\n  return (p:gsub(\"[%^%$%(%)%%%.%[%]%*%+%-%?]\", \"%%%0\"))\nend\n\nlocal CAP = \"[%u\\195\\196\\197][%a\\128-\\255%-]*\"\n\n-- Returns the spans {kind, first byte, last byte} found in text, ordered by position.\nfunction M.detect(text)\n  local spans = {}\n  local lower = text:lower()\n  for _, rule in ipairs(RULES) do\n    for _, pat in ipairs(rule.patterns or {}) do\n      local init = 1\n      while init <= #text do\n        local s, e = text:find(pat, init)\n        if not s then break end\n        local ok = true\n        if rule.validator == \"iban\" then\n          local last = iban_end(text, s)\n          if last then e = last else ok = false end\n      \
    \  elseif rule.validator then\n          ok = validators[rule.validator](text:sub(s, e))\n        end\n        if ok and rule.context then\n          ok = has_context(lower, s, rule.context, rule.context_window or 24)\n        end\n        if ok and not overlaps(spans, s, e) then\n          spans[#spans + 1] = {rule.kind, s, e}\n          init = e + 1\n        else\n          init = s + 1\n        end\n      end\n    end\n    for _, ctx in ipairs(rule.after or {}) do\n      local init = 1\n      while true do\n        local s, e = lower:find(ctx, init, true)\n        if not s then break end\n        local ts, te = text:find(\"^\" .. CAP, e + 1)\n        if ts then\n          local last, n = te, 1\n          while n < (rule.tokens or 1) do\n            local s2, e2 = text:find(\"^ \" .. CAP, last + 1)\n            if not s2 then break end\n            last, n = e2, n + 1\n          end\n          if not overlaps(spans, ts, last) then\n            spans[#spans + 1] = {rule.kind, ts, last}\n\
    \          end\n        end\n        init = e + 1\n      end\n    end\n    if rule.gazetteer then\n      rule.set = rule.set or {}\n      for _, w in ipairs(rule.gazetteer) do rule.set[w] = true end\n      for s, word, e in text:gmatch(\"()([%a\\128-\\255]+)()\") do\n        if rule.set[word:lower()] then\n          local last = e - 1\n          if rule.surname then\n            local s2, e2 = text:find(\"^ \" .. CAP, e)\n            if s2 then last = e2 end\n          end\n          if not overlaps(spans, s, last) then\n            spans[#spans + 1] = {rule.kind, s, last}\n          end\n        end\n      end\n    end\n    for _, pre in ipairs(rule.prefixes or {}) do\n      local pat = \"%f[%a]\" .. escape(pre) .. \"[%a\\128-\\255%-]+ %d+%a?%f[^%w]\"\n      local init = 1\n      while true do\n        local s, e = lower:find(pat, init)\n        if not s then break end\n        if not overlaps(spans, s, e) then\n          spans[#spans + 1] = {rule.kind, s, e}\n        end\n        init\
    \ = e + 1\n      end\n    end\n    for _, suf in ipairs(rule.suffixes or {}) do\n      local pat = \"[%a\\128-\\255%-]*\" .. escape(suf) .. \" %d+%a?\"\n      local init = 1\n      while true do\n        local s, e = text:find(pat, init)\n        if not s then break end\n        if not overlaps(spans, s, e) then\n          spans[#spans + 1] = {rule.kind, s, e}\n        end\n        init = e + 1\n      end\n    end\n  end\n  table.sort(spans, function(a, b) return a[2] < b[2] end)\n  return spans\nend\n\n-- Returns the redacted text and the spans that were replaced.\nfunction M.redact(text)\n  local spans = M.detect(text)\n  if #spans == 0 then return text, spans end\n  local parts, pos = {}, 1\n  for _, sp in ipairs(spans) do\n    parts[#parts + 1] = text:sub(pos, sp[2] - 1)\n    parts[#parts + 1] = (PLACEHOLDER:gsub(\"{kind}\", sp[1]))\n    pos = sp[3] + 1\n  end\n  parts[#parts + 1] = text:sub(pos)\n  return table.concat(parts), spans\nend\n\nlocal function walk(v)\n  if type(v) ==\
    \ \"string\" then\n    local out, spans = M.redact(v)\n    return out, #spans\n  elseif type(v) == \"table\" then\n    local total = 0\n    for k, x in pairs(v) do\n      local out, n = walk(x)\n      v[k] = out\n      total = total + n\n    end\n    return v, total\n  end\n  return v, 0\nend\n\n-- Fluent Bit filter entry point (call = redact_record). Adds pii_redactions so Loki can alert the\n-- team whose service logs personal data, without storing the data itself.\nfunction redact_record(tag, timestamp, record)\n  local out, n = walk(record)\n  if n == 0 then return 0, timestamp, record end\n  out[\"pii_redactions\"] = n\n  return 2, timestamp, out\nend\n\nREDACTOR = M\nreturn M\n"
  tenant.lua: "-- Sets the Loki tenant from the Kubernetes namespace: sov-<authority> -> <authority>, anything else -> platform.\n-- In the compose e2e there is no Kubernetes metadata; records carry \"tenant\" themselves.\n-- A rewrite_tag filter then re-tags each record sov.<tenant>, because Fluent Bit's Loki output takes the\n-- tenant id once per chunk: without it, two authorities' lines in one chunk land in one tenant.\nfunction set_tenant(tag, timestamp, record)\n  local ns = record[\"kubernetes\"] and record[\"kubernetes\"][\"namespace_name\"]\n  local tenant = record[\"tenant\"]\n  if ns then\n    tenant = ns:match(\"^sov%-(.+)$\") or \"platform\"\n  end\n  record[\"sov_tenant\"] = tenant or \"platform\"\n  return 2, timestamp, record\nend\n"
