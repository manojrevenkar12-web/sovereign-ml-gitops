# GENERATED by scripts/scaffold.py from deploy/compose/fluent-bit.base.yaml and tenants/*.yaml
env:
  LOKI_HOST: loki
  LOKI_PORT: '3100'
service:
  flush: 1
  log_level: info
pipeline:
  inputs:
  - name: http
    listen: 0.0.0.0
    port: 9880
    tag: e2e
  filters:
  - name: lua
    match: e2e
    script: /fluent-bit/scripts/redact.lua
    call: redact_record
  - name: lua
    match: e2e
    script: /fluent-bit/scripts/tenant.lua
    call: set_tenant
  - name: rewrite_tag
    match: e2e
    rule: $sov_tenant ^(.+)$ sov.$1 false
    emitter_name: sov_by_tenant
  outputs:
  - name: loki
    match: sov.kreis-lindenau
    host: ${LOKI_HOST}
    port: ${LOKI_PORT}
    tenant_id: kreis-lindenau
    remove_keys: sov_tenant
    labels: job=fluent-bit
    line_format: json
  - name: loki
    match: sov.stadt-nordhafen
    host: ${LOKI_HOST}
    port: ${LOKI_PORT}
    tenant_id: stadt-nordhafen
    remove_keys: sov_tenant
    labels: job=fluent-bit
    line_format: json
  - name: loki
    match: sov.stadt-weidenbach
    host: ${LOKI_HOST}
    port: ${LOKI_PORT}
    tenant_id: stadt-weidenbach
    remove_keys: sov_tenant
    labels: job=fluent-bit
    line_format: json
  - name: loki
    match: sov.platform
    host: ${LOKI_HOST}
    port: ${LOKI_PORT}
    tenant_id: platform
    remove_keys: sov_tenant
    labels: job=fluent-bit
    line_format: json
