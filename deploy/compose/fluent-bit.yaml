# Same filters as deploy/observability/fluent-bit-values.yaml, with an HTTP input instead of container logs.
service:
  flush: 1
  log_level: info
pipeline:
  inputs:
    - name: http
      listen: 0.0.0.0
      port: 9880
      tag: e2e
  filters:
    - name: lua
      match: e2e
      script: /fluent-bit/scripts/redact.lua
      call: redact_record
    - name: lua
      match: e2e
      script: /fluent-bit/scripts/tenant.lua
      call: set_tenant
    # The Loki output reads tenant_id_key once per chunk, not per record. Re-tag by tenant so that a chunk
    # never holds two authorities' lines (the live probe caught exactly that).
    - name: rewrite_tag
      match: e2e
      rule: $sov_tenant ^(.+)$ sov.$1 false
      emitter_name: sov_by_tenant
  outputs:
    - name: loki
      match: "sov.*"
      host: loki
      port: 3100
      tenant_id_key: sov_tenant
      remove_keys: sov_tenant
      labels: job=e2e
      line_format: json
