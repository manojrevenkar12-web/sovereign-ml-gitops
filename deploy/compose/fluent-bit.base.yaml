# Same filters as deploy/observability/fluent-bit-values.yaml, with an HTTP input instead of container logs.
# scripts/scaffold.py adds one Loki output per authority and writes deploy/generated/fluent-bit/e2e.yaml.
env:
  LOKI_HOST: loki
  LOKI_PORT: "3100"
service:
  flush: 1
  log_level: info
pipeline:
  inputs:
    - name: http
      listen: 0.0.0.0
      port: 9880
      tag: e2e
  filters:
    - name: lua
      match: e2e
      script: /fluent-bit/scripts/redact.lua
      call: redact_record
    - name: lua
      match: e2e
      script: /fluent-bit/scripts/tenant.lua
      call: set_tenant
    # Re-tag by authority; each authority has its own Loki output with a fixed tenant id.
    - name: rewrite_tag
      match: e2e
      rule: $sov_tenant ^(.+)$ sov.$1 false
      emitter_name: sov_by_tenant
